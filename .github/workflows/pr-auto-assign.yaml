name: PR Auto Assign

on:
  pull_request_target:
    types: [opened]

permissions: {}

cache-mode: none

jobs:
  assign-author:
    permissions:
      pull-requests: write
    runs-on: ubuntu-24.04
    steps:
      - name: Assign author
        uses: toshimaru/auto-author-assign@415448809ea5ba0e171b251632720b009df3d8d6 # v3.1.1
