name: Release
run-name: ${{ inputs.prerelease && 'Pre-Release' || 'Release' }} ${{ inputs.version }}

# A release is dispatched on main. Nobody pushes the tag: once a member of clients other than
# the dispatcher approves the "release-approval" environment, the approve job creates it as the
# coder-release-publisher App, which is the only actor the tag ruleset lets create v* tags. Its
# key is in Cloud KMS, and only the approve job of main's copy of this file, in
# release-approval, may sign with it. See CONTRIBUTING.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v1.19.0. Must match package.json at the commit"
        required: true
        type: string
      commit:
        description: "Full SHA of the commit to release: on main, or on any branch for a pre-release"
        required: true
        type: string
      prerelease:
        description: "Publish as a pre-release (vsce/ovsx --pre-release)"
        required: true
        type: boolean
        default: false

permissions: {}

# Build releases from a clean install. This also keeps the package job, which runs the released
# commit's scripts in main's context, from reading or writing main's caches.
cache-mode: none

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  PRE_RELEASE_FLAG: ${{ inputs.prerelease && '--pre-release' || '' }}

jobs:
  # Fails a bad request before it asks for approval. The jobs below run the scripts of the commit
  # they build, so a release comes from a reviewed commit on main, and a pre-release from a
  # branch of this repository (never a fork) whose changes the approver reviews.
  validate:
    name: Check the request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.repository == 'coder/vscode-coder'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the request
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          # Also stops a run started from a tag or from another branch.
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || fail "This workflow only runs on main, not on $GITHUB_REF."
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "version must look like v1.2.3, got '$VERSION'."
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || fail "commit must be a full 40-character SHA, got '$COMMIT'."
          if [[ "$PRERELEASE" == "true" ]]; then
            [[ -n "$(git branch --remotes --contains "$COMMIT" 2>/dev/null)" ]] || fail "$COMMIT is not on a branch of $GITHUB_REPOSITORY."
          else
            git merge-base --is-ancestor "$COMMIT" "$GITHUB_SHA" || fail "$COMMIT is not on main. Only a pre-release can come from another branch."
          fi

          PACKAGE_VERSION="$(git show "$COMMIT:package.json" | jq -r .version)"
          [[ "${VERSION#v}" == "$PACKAGE_VERSION" ]] || fail "version $VERSION does not match package.json ($PACKAGE_VERSION) at $COMMIT."

  # A release is tagged only after a reviewer of the "release-approval" environment approves
  # this job, and it is built and published only once it is tagged.
  approve:
    name: Approve and tag the release
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-approval
    permissions:
      contents: read
      id-token: write # Cloud KMS signs the App's JWT
    steps:
      # For the tags and the history. Nothing from the tree runs in this job.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Here and not in the validate job, because the tags can change while the run waits for
      # approval.
      - name: Check the tag
        id: check
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          latest_release() { git tag --list 'v*' --sort=-version:refname "$@" | grep -E -m 1 '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; }

          # A re-run finds the tag that the first attempt created.
          if existing="$(git rev-parse --verify --quiet "refs/tags/$VERSION^{commit}")"; then
            [[ "$existing" == "$COMMIT" ]] || fail "Tag $VERSION already exists at $existing, not at $COMMIT."
            echo "Tag $VERSION already exists at $COMMIT."
            echo "create=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Each release needs a commit of its own.
          released="$(git tag --points-at "$COMMIT" --list 'v*' | paste -sd ' ' -)"
          [[ -z "$released" ]] || fail "$COMMIT was already released as $released. Release a newer commit."

          latest="$(latest_release)"
          if [[ -n "$latest" ]]; then
            printf '%s\n' "$latest" "$VERSION" | sort -V -C || fail "$VERSION is not newer than $latest, the latest release."
          fi

          # Only releases on main count here, so a pre-release from a branch does not block the next release.
          latest_on_main="$(latest_release --merged "$GITHUB_SHA")"
          if [[ -n "$latest_on_main" ]]; then
            git merge-base --is-ancestor "$latest_on_main" "$COMMIT" || fail "$COMMIT does not contain $latest_on_main, the latest release on main."
          fi

          echo "create=true" >> "$GITHUB_OUTPUT"

      # The App can also write to other repositories, so the token is asked for this one only.
      - name: Generate release App token
        id: app_token
        if: steps.check.outputs.create == 'true'
        uses: coder/github-app-token-action@00eaec58ee1bfea9c8b48655b7ab7470b07739e5 # main 2026-11-17
        with:
          client-id: ${{ secrets.CODER_RELEASE_PUBLISHER_APP_ID }}
          kms-key: ${{ secrets.CODER_RELEASE_PUBLISHER_APP_KMS_KEY }}
          workload-identity-provider: ${{ secrets.APP_KEYS_WORKLOAD_ID_PROVIDER }}
          owner: coder
          repositories: vscode-coder
          permissions: |
            contents: write
            workflows: write

      # An annotated tag, through the API: nothing is pushed from this job's checkout.
      - name: Create the tag
        if: steps.check.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$VERSION" -f message="Release $VERSION" -f object="$COMMIT" -f type=commit \
            --jq .sha)"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$VERSION" -f sha="$tag_object" >/dev/null
          echo "Created tag $VERSION at $COMMIT."

  package:
    name: Package
    needs: approve
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      vsix: ${{ steps.package.outputs.vsix }}
      vsce-version: ${{ steps.package.outputs.vsce-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.version }}
          persist-credentials: false

      # The validate job checked package.json at this commit.
      - name: Check the tag is at the approved commit
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          [[ "$(git rev-parse HEAD)" == "$COMMIT" ]] || { echo "::error::The tag is not at $COMMIT."; exit 1; }

      - name: Setup pnpm, Node.js, and dependencies
        uses: ./.github/actions/pnpm-setup

      - name: Build extension
        run: pnpm build:production

      - name: Package extension
        id: package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          VSIX="$(node -p "require('./package.json').name")-${VERSION#v}.vsix"
          pnpm vsce package --no-dependencies $PRE_RELEASE_FLAG --out "$VSIX"
          echo "vsix=$VSIX" >> "$GITHUB_OUTPUT"
          echo "vsce-version=$(pnpm exec vsce --version)" >> "$GITHUB_OUTPUT"

      - name: Upload VSIX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.vsix }}
          path: ${{ steps.package.outputs.vsix }}
          if-no-files-found: error

  publish-vscode:
    name: Publish to VS Marketplace
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: publish
    permissions:
      id-token: write # Allows generating an OIDC token.
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # Only accept a plain version: this value comes from a job that ran dependency code.
      - name: Install vsce
        env:
          VSCE_VERSION: ${{ needs.package.outputs.vsce-version }}
        run: |
          if [[ ! "$VSCE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Error: unexpected vsce version '$VSCE_VERSION'"
            exit 1
          fi
          npm install -g "@vscode/vsce@${VSCE_VERSION}"

      - name: Download VSIX
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.package.outputs.vsix }}

      - name: Publish to VS Marketplace
        env:
          VSIX: ${{ needs.package.outputs.vsix }}
        run: vsce publish $PRE_RELEASE_FLAG --packagePath "$VSIX" --oidc

  publish-ovsx:
    name: Publish to Open VSX
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: publish
    permissions:
      id-token: write # Allows generating an OIDC token.
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install ovsx
        run: npm install -g ovsx@1.2.0

      - name: Download VSIX
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.package.outputs.vsix }}

      - name: Publish to Open VSX
        env:
          VSIX: ${{ needs.package.outputs.vsix }}
        run: ovsx publish "$VSIX" $PRE_RELEASE_FLAG --trusted-publishing

  publish-github:
    name: Create GitHub ${{ inputs.prerelease && 'Pre-Release' || 'Release' }}
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # Required to create the release and generate release notes
      contents: write
      pull-requests: read
    steps:
      - name: Download VSIX
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.package.outputs.vsix }}

      # The tag already exists (the approve job created it), so this only creates the release.
      - name: Create draft release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          draft: true
          files: ${{ needs.package.outputs.vsix }}
          generate_release_notes: true
          fail_on_unmatched_files: true
