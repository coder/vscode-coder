name: CI

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

cache-mode: read

# Cancel superseded PR runs; main pushes each get their own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm, Node.js, and dependencies
        uses: ./.github/actions/pnpm-setup

      - run: pnpm typecheck

      - run: pnpm format:check

      - name: Check vendored Coder client
        run: pnpm sync:coder && git diff --exit-code vendor/coder

      - run: pnpm lint

  test-unit:
    name: Unit Test (${{ matrix.name }}, Electron ${{ matrix.electron-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported version: VS Code 1.105 (Sept 2025) -> Electron 37 -> Node 22
        # See https://github.com/ewanharris/vscode-versions for version mapping.
        include:
          - { os: ubuntu-24.04, name: Linux, electron-version: "37" }
          - { os: ubuntu-24.04, name: Linux, electron-version: "latest" }
          - {
              os: windows-2025-vs2026,
              name: Windows,
              electron-version: "latest",
            }
          - { os: macos-15, name: macOS, electron-version: "latest" }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm, Node.js, and dependencies
        uses: ./.github/actions/pnpm-setup

      - name: Run tests with Electron ${{ matrix.electron-version }}
        run: ./scripts/test-electron.sh ${{ matrix.electron-version }}
        shell: bash
        env:
          CI: true
          EXPECTED_ARCH: ${{ runner.arch }}

  test-integration:
    name: Integration Test (${{ matrix.name }}, VS Code ${{ matrix.vscode-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: Linux, vscode-version: "1.105.0" }
          - { os: ubuntu-24.04, name: Linux, vscode-version: "stable" }
          - { os: windows-2025-vs2026, name: Windows, vscode-version: "stable" }
          - { os: macos-15, name: macOS, vscode-version: "stable" }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm, Node.js, and dependencies
        uses: ./.github/actions/pnpm-setup

      - run: pnpm build

      - name: Run integration tests on VS Code ${{ matrix.vscode-version }}
        # xvfb only exists on Linux; on Windows/macOS the runner has a real display.
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} pnpm test:integration --label "VS Code ${{ matrix.vscode-version }}"
        shell: bash

  pixel:
    name: Pixel
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Forks and Dependabot can't read the PIXEL_KEY secret.
    if: github.repository_owner == 'coder' && github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm, Node.js, and dependencies
        uses: ./.github/actions/pnpm-setup

      - name: Install Chromium
        uses: ./.github/actions/playwright-chromium

      # Builds the Storybook (buildCommand in pixel.jsonc) and snapshots it.
      - name: Snapshot
        run: pnpm exec pixel-storybook
        env:
          PIXEL_KEY: ${{ secrets.PIXEL_KEY }}
          # On pull_request, github.sha is a synthetic merge commit, not the PR head.
          PIXEL_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          # Auto-approve on mainline to avoid blocking CI after squash merges.
          PIXEL_AUTO_REVIEW: ${{ github.ref == 'refs/heads/main' }}

  package:
    name: Package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm, Node.js, and dependencies
        uses: ./.github/actions/pnpm-setup

      - name: Build extension
        run: pnpm build:production

      - name: Package extension
        id: package
        run: |
          VSIX="$(node -p "const p = require('./package.json'); p.name + '-' + p.version")-$(git rev-parse --short HEAD).vsix"
          pnpm vsce package --no-dependencies --out "$VSIX"
          echo "vsix=$VSIX" >> "$GITHUB_OUTPUT"

      # Builds from main keep the default retention.
      - name: Upload VSIX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.package.outputs.vsix }}
          if-no-files-found: error
          retention-days: ${{ github.ref != 'refs/heads/main' && 7 || 0 }}
          archive: false
