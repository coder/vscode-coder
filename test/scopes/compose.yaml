# A throwaway deployment for `pnpm test:scopes`; see CONTRIBUTING.md.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: coder
      POSTGRES_PASSWORD: coder
      POSTGRES_DB: coder
    healthcheck:
      test: pg_isready -U coder
      interval: 2s
      retries: 30

  coder:
    image: ${CODER_IMAGE:-ghcr.io/coder/coder-preview@sha256:22951b2840d24d0b2dcb75990f499cb844840ecd763731cc0361683c1ee457aa}
    ports: ["127.0.0.1:7080:7080"]
    environment:
      CODER_PG_CONNECTION_URL: postgres://coder:coder@postgres:5432/coder?sslmode=disable
      CODER_HTTP_ADDRESS: 0.0.0.0:7080
      CODER_ACCESS_URL: http://localhost:7080
      CODER_OAUTH2_PROVIDER_ENABLE: "true"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: curl -fs http://localhost:7080/healthz
      interval: 2s
      retries: 60
