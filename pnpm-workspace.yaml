packages:
  - packages/*

catalog:
  "@radix-ui/react-select": ^2.3.7
  "@rolldown/plugin-babel": ^0.2.3
  "@storybook/addon-a11y": ^10.5.10
  "@storybook/addon-docs": ^10.5.10
  "@storybook/react-vite": ^10.5.10
  "@tanstack/react-query": ^5.102.2
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.5
  "@types/vscode-webview": ^1.57.5
  "@vitejs/plugin-react": ^6.1.0
  "@vscode-elements/react-elements": ^2.4.0
  "@vscode/codicons": 0.0.46-24
  babel-plugin-react-compiler: ^1.0.0
  coder: github:coder/coder#9548f239a8bdfe74d0f62eafc41c97b2d7adca91 # v2.36.1
  date-fns: ^4.4.0
  react: ^19.2.8
  react-dom: ^19.2.8
  storybook: ^10.5.10
  typescript: ^6.0.3
  vite: ^8.2.2

catalogMode: strict

dedupePeers: true

allowBuilds:
  "@vscode/vsce-sign": true
  bufferutil: true
  electron: true
  esbuild: true
  keytar: false
  odiff-bin: true
  unrs-resolver: true
  utf-8-validate: true

overrides:
  "@vscode-elements/elements": ^2.5.1
  # yauzl 2 dies silently on Node >= 24.16, breaking electron's postinstall; drop when electron/electron#51886 ships.
  yauzl: ^3.4.0

# pnpm 11 defaults to 1440 (24h); 0 opts out of the release-age quarantine.
minimumReleaseAge: 0
