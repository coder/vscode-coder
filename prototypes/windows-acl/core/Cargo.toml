[package]
name = "acl-prototype-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Narrow Windows ACL read/write prototype core"
publish = false

[dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
] }
