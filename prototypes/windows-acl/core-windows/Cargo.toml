[package]
name = "acl-prototype-core-windows"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Narrow Windows ACL prototype core using the windows projection"
publish = false

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", default-features = false, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
] }
